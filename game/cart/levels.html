.gmc-t{font-size:clamp(10px,3vw,12px);line-height:1.9;color:#e8e8ff;margin-bottom:12px}.gmc-t .y{color:#ffd400;font-weight:400}
.gmc-x{font-size:9px;line-height:2;color:#c9ced6;margin-bottom:12px}.gmc-x small{display:block;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#9a9ad0;margin-top:6px}.gmc-x .o{color:#fc9838}
.gmc-c{font-size:8px;color:#6fe7ff;margin-bottom:14px}

.gmc-b a,.gmc-b button{display:block;font:inherit;font-size:clamp(10px,3.2vw,13px);padding:14px 10px;border:0;cursor:pointer;text-decoration:none;color:#000;background:#fcfcfc;box-shadow:4px 4px 0 #555}
.gmc-b .go{background:#3fe36a;box-shadow:4px 4px 0 #0b6b22;font-size:clamp(12px,3.8vw,15px)}
.gmc-b .pitch{background:#ffb8ff;box-shadow:4px 4px 0 #8a3a80}
.gmc-b a:active,.gmc-b button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
#gmcard.over .gmc-box{border-color:#ff5a5a}#gmcard.over .gmc-k{color:#ff5a5a}
#gmcard.clear .gmc-box,#gmcard.win .gmc-box{border-color:#3fe36a}
#gmcard.unlock .gmc-box{border-color:#ffd400;animation:rmpzin .25s steps(4),unl 1s steps(2) infinite}#gmcard.unlock .gmc-h{font-size:clamp(18px,6.2vw,30px)}
@keyframes unl{50%{box-shadow:0 0 0 4px #000,8px 8px 0 #b05000,0 0 40px #ffd400}}
#gmcard.end .gmc-h{color:#3fe36a;text-shadow:3px 3px 0 #0b6b22}
#gmcard.pz .gmc-box{border-color:#fc9838}#gmcard.pz .gmc-k{color:#ff5a5a}
/* ---- emulator tweaks ---- */
.dp{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:4px 0 8px}
.dp-tk{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:center;max-width:220px;font-size:11px;color:#9aa0a8}.dp-tk .now{color:#3fe36a;font-size:16px}.dp-tk .neg{color:#ff5a5a;font-size:18px}.dp-tk em{flex-basis:100%;font-style:normal;font-size:6px;color:#9aa0a8;border:1px solid #666;padding:2px}
.dp-bin{position:relative;display:inline-block;width:46px;height:84px;border:3px solid #fcfcfc;border-top-width:6px;border-radius:0 0 6px 6px;background:#0b0b22;overflow:hidden}.dp-bin i{position:absolute;left:0;right:0;bottom:0;transition:height .25s steps(3)}.dp-bin b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:400;color:#fff;text-shadow:1px 1px 0 #000}
.dp-v{display:block;font-size:10px;line-height:1.8;color:#fcfcfc}.dp-kg{font-size:9px;color:#ffd400;margin-bottom:6px}.dp-r{display:block;font-size:8px;color:#9a9ad0}.dp-f{display:block;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#ffb8ff;margin-top:10px;border-top:1px dashed #555;padding-top:8px}
#gmcard.depot .gmc-box{border-color:#6fe7ff}#gmcard.depot .gmc-h{font-size:clamp(22px,7vw,34px)}
#gmcard.dpo .gmc-h{color:#ff5a5a;text-shadow:3px 3px 0 #500;font-size:clamp(28px,9vw,44px);animation:dpo .5s steps(2) 3}@keyframes dpo{50%{transform:scale(1.15)}}
.gmc-x .ex{color:#9aa0a8;border:1px solid #666;padding:1px 3px;font-size:6px}
/* ---- snackman-ux: phone-first HUD, WATCH button, captions, big pad, icon rows ---- */
#gmhud{font-size:10px;gap:8px;padding:10px 10px 4px}#gmhud button{font-size:10px;padding:10px 10px;min-height:40px}
#gmhud #gmw{border-color:#6fe7ff;color:#6fe7ff}#gmhud #gmw.on{background:#6fe7ff;color:#000}
#gmli{font-size:12px;color:#3fe36a}#gmli.lo{color:#ff5a5a;animation:unl 1s steps(2) infinite}
#gmx{font-size:10px;min-height:24px;color:#fcfcfc}#gmx .bar{width:70px;height:10px}
#gmcap{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4;width:max-content;max-width:94%;text-align:center;font-size:clamp(11px,3.4vw,15px);line-height:1.6;color:#000;background:#ffd400;border:3px solid #000;box-shadow:4px 4px 0 #b05000;padding:10px 12px}
#gmcap[hidden]{display:none}#gmcap.pop{animation:rmpzin .3s steps(4)}
#gmpad{grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,64px);gap:6px}#gmpad button{font-size:24px}
.gmc-t .ic{display:block;font-size:clamp(28px,9vw,44px);line-height:1.3;margin:2px 0 8px;letter-spacing:2px}
#gmcard.intro .gmc-h,#gmcard.take .gmc-h{font-size:clamp(14px,4.8vw,22px);line-height:1.5}
.gmc-b{grid-template-columns:1fr}.gmc-b button,.gmc-b a{min-height:52px}
#gmcard.intro .gmc-b{grid-template-columns:1fr 1fr}#gmcard.intro .gmc-b .alt{background:#6fe7ff;box-shadow:4px 4px 0 #1a6a80}
#gm{background:#000}#gmx2,#gmsnd{display:none}#snd{display:none}
/* ---- i18n display rules: every DOM text >= 14px (Spanish/Italian run longer, so the HUD wraps to two rows) ---- */
#gmhud{flex-wrap:wrap;row-gap:4px;font-size:14px}#gmlv{flex:1 0 100%;font-size:14px}#gmsc{flex:1;font-size:14px}#gmli{font-size:14px}
#gmhud button{font-size:14px;padding:8px 8px;min-height:40px}
#gmx{font-size:14px;min-height:26px}#gmx .ex,.gmc-x .ex,.dp-v .ex{font-size:14px;padding:1px 4px}
.gmc-k{font-size:14px;line-height:1.5}.gmc-h{font-size:clamp(16px,5.4vw,26px)}#gmcard.intro .gmc-h,#gmcard.take .gmc-h{font-size:clamp(15px,4.8vw,22px)}
.gmc-t{font-size:14px;line-height:1.7}.gmc-x{font-size:14px;line-height:1.7}.gmc-x small{font-size:14px}.gmc-c{font-size:14px;line-height:1.5}
.gmc-b a,.gmc-b button{font-size:14px;line-height:1.35}.gmc-b .go{font-size:clamp(14px,3.8vw,15px)}
#gmcap{font-size:clamp(14px,3.6vw,15px)}#gmkeys{font-size:14px;line-height:1.5;text-align:center;padding:8px 10px 12px}
.dp-tk{font-size:14px;max-width:240px}.dp-tk .now{font-size:16px}.dp-tk em{font-size:14px;line-height:1.45;flex-basis:100%}.dp-bin b{font-size:14px}
.dp-v{font-size:14px;line-height:1.6}.dp-kg{font-size:14px}.dp-r{font-size:14px}.dp-f{font-size:14px}
#gmcard.intro .gmc-b{grid-template-columns:1fr}
#gmcard{z-index:7}

<button id="snd" type="button" aria-pressed="false">♪ OFF</button>
<div id="gm" role="dialog" aria-modal="true" aria-label="Snackman: the levels" data-i18n-attr="aria-label:lv.aria" hidden>
 <div id="gmhud"><span id="gmlv">SNACKMAN</span><span id="gmsc">0 SATS</span><span id="gmli" aria-label="Time left" data-i18n-attr="aria-label:lv.timeLeft">⏱ 30</span><button type="button" id="gmw" title="Autoplay" data-i18n-attr="title:lv.autoTip">▶ WATCH</button><button type="button" id="gmsnd" aria-pressed="false" title="Sound" data-i18n-attr="title:lv.sound">♪ OFF</button><button type="button" id="gmpz" title="Pause" data-i18n-attr="title:lv.pauseTip,aria-label:lv.pauseTip">❚❚</button><button type="button" id="gmx2" title="Back to the story" data-i18n-attr="title:lv.backTip,aria-label:lv.backTip">✕</button></div>
 <div id="gmx"></div>
 <div id="gmwrap"><canvas id="gmc" width="330" height="270" aria-label="Snackman maze" data-i18n-attr="aria-label:lv.maze"></canvas><div id="gmcap" hidden aria-live="polite"></div></div>
 <div id="gmpad" aria-label="Direction pad" data-i18n-attr="aria-label:lv.pad"><button type="button" class="u" data-d="U" aria-label="Up" data-i18n-attr="aria-label:lv.up">▲</button><button type="button" class="l" data-d="L" aria-label="Left" data-i18n-attr="aria-label:lv.left">◀</button><button type="button" class="r" data-d="R" aria-label="Right" data-i18n-attr="aria-label:lv.right">▶</button><button type="button" class="d" data-d="D" aria-label="Down" data-i18n-attr="aria-label:lv.down">▼</button></div>
 <p id="gmkeys" data-i18n="lv.keys">ARROWS / WASD / SWIPE · ▶ WATCH = AUTOPLAY</p>
 <div id="gmcard" hidden><div class="gmc-box"></div></div>
</div>
<script>
/* sound helpers (verbatim from the Roadmap v2 page; the level engine calls snd/AC/beep/play) */
let snd=false,AC=null,buf={};
function ensureAC(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();const ext=new Audio().canPlayType('audio/ogg; codecs="vorbis"')?'ogg':'m4a';['plop','hit'].forEach(n=>fetch('a/snackman-'+n+'.'+ext).then(r=>r.arrayBuffer()).then(b=>AC.decodeAudioData(b)).then(d=>buf[n]=d).catch(()=>{}))}
function play(n,v){if(!snd||!AC||!buf[n])return;const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v||.7;s.buffer=buf[n];s.connect(g).connect(AC.destination);s.start()}
function beep(f,d,when,type,v){if(!snd||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(when||0);o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
document.getElementById('snd').onclick=()=>{snd=!snd;if(snd){ensureAC();AC.resume&&AC.resume();beep(784,.1);beep(1047,.12,.1)}};
/* sound on at first tap/key, like a console */
const unlock=()=>{if(!snd)document.getElementById('snd').click();removeEventListener('pointerdown',unlock,true);removeEventListener('keydown',unlock,true)};
addEventListener('pointerdown',unlock,true);addEventListener('keydown',unlock,true);
</script>
<script src="../shared/vendor/jaguarutz-kit.js"></script><script src="../shared/i18n/strings.js"></script><script src="levels.js"></script><script src="../../shared/hub/save.js"></script>
<script>
const q=new URLSearchParams(location.search),lv=q.get('level');
document.getElementById('gm').hidden=false;
/* player-code save: furthest checkpoint {level,score}, best score, master unlock (server, per player) */
HWSave.load('snackman').then(S=>{S=S||{};
 SnackGame.rec=S.choice||null;
 SnackGame.onSave=s=>{const far=s.level>=(S.level||0),c=S.choice||{n:0,cash:0,hoard:0,over:0,net:0};
  if(s.choice){c.n++;c[s.choice.r]=(c[s.choice.r]||0)+1;c.net+=s.choice.v;c.last=s.choice;SnackGame.rec=c}
  S={level:far?s.level:S.level,score:far?s.score:S.score,best:Math.max(S.best||0,s.score||0),master:!!(S.master||s.master),choice:c};HWSave.save('snackman',S)};
 if(q.has('resume')&&S.level!=null)SnackGame.open({level:S.level,score:S.score||0,from:'resume'});
 else SnackGame.open(lv!=null&&(/^[0-2]$/.test(lv)||(lv==='3'&&S.master))?{level:+lv,from:'shelf'}:{fresh:true,from:'shelf'});
});
const key=k=>dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true}));
window.EMU={title:'SNACKMAN · LEVELS',ownPause:true,pause(){key('p')},resume(){key('p')},
 start(){const b=document.querySelector('#gmcard:not([hidden]) .go')||document.querySelector('#gmcard:not([hidden]) button');if(b)b.click();else key('p')}};
SNK.boot();SNK.onChange(()=>{EMU.title=SNK.t('lv.emu');EMUCART.title(EMU.title)});
</script><script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script><script src="../../shared/hub/clicks.js" data-game="snackman"></script></body></html>
