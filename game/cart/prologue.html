<!doctype html><html lang="en"><head><script src="../../shared/hub/observe.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Snackman · Prologue: Put a bid on plastic</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fcfcfc;overflow:hidden;font-family:"Press Start 2P",monospace;-webkit-tap-highlight-color:transparent}
main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px}
.gbox{position:relative;width:min(98vw,calc((100dvh - 86px)*256/224));aspect-ratio:256/224}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#000;box-shadow:0 0 0 2px #1a1a1a}
.tap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border:0;cursor:pointer}
.tap span{background:#F8B800;color:#000;font:400 clamp(12px,3vmin,18px)/1.3 "Press Start 2P",monospace;padding:16px 20px;box-shadow:0 6px 0 #8a6500}.tap small{display:block;font-size:8px;letter-spacing:.14em;margin-top:8px}.tap[hidden]{display:none}
.ctl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.ctl button{font:inherit;font-size:clamp(9px,2.2vmin,12px);border:0;padding:12px 14px;cursor:pointer;box-shadow:3px 3px 0 #333}
#bid{background:#58D854;color:#000}#next{background:#FFD400;color:#000;box-shadow:3px 3px 0 #8a6500}#next[hidden]{display:none}.b2{background:#1a1a1a;color:#ddd}
</style>
<script src="../../shared/emu/cart.js"></script><script src="../../shared/sound/cart-sound.js"></script>
</head><body><main>
<div class="gbox"><canvas id="cv" width="256" height="224" aria-label="Snackman: the interceptor game versus a bid on plastic"></canvas><button class="tap" id="tap" type="button"><span>▶ PLAY SNACKMAN<small>SOUND ON</small></span></button></div>
<div class="ctl"><button id="bid" type="button">Ⓐ PUT A BID ON PLASTIC ▸</button><button class="b2" id="replay" type="button">↻ REPLAY</button><button id="next" type="button" hidden>LEVEL 1 ▶</button></div>
</main>
<script src="bid-game.js"></script>
<script>
/* flow copied from the frozen /plastic/play page (play.html); donation panel, share and analytics removed */
const $=id=>document.getElementById(id);const g=BidGame.create($('cv'));let started=false,dropped=false,autoT=null;
g.frame(3);
function begin(){if(started)return;started=true;$('tap').hidden=true;try{const SS=window.SnackSound;if(BidGame.sound&&!(SS&&SS.inShell&&!SS.on))BidGame.sound.enable(!(SS&&SS.inShell))}catch(e){}g.start();clearTimeout(autoT);autoT=setTimeout(()=>{if(!dropped)drop()},26000)}
function drop(){begin();dropped=true;clearTimeout(autoT);g.demo(BidGame.GOAL,true)}
$('tap').onclick=begin;$('bid').onclick=drop;$('replay').onclick=()=>{dropped=false;started=false;$('next').hidden=true;begin()};
const next=()=>{try{BidGame.sound&&BidGame.sound.enable(false)}catch(e){}location.href='levels.html?level=0'};$('next').onclick=next;
/* after the win ending plays, offer the levels */
setInterval(()=>{const s=g._state&&g._state();if(s&&s.outcome==='win'&&s.endAt>=0&&s.t-s.endAt>4&&$('next').hidden){$('next').hidden=false;$('next').focus()}},500);
addEventListener('keydown',e=>{if(EMUCART.paused)return;if(e.key==='Enter'||e.key===' '||e.key==='z'||e.key==='Z'){if(document.activeElement.tagName==='BUTTON'&&document.activeElement.id!=='tap')return;e.preventDefault();window.EMU.start()}});
window.EMU={title:'SNACKMAN · PROLOGUE',start(){if(!started)begin();else if(!$('next').hidden)next();else if(!dropped)drop()},
 pause(){g.pause()},resume(){g.resume()}};
EMUCART.title(EMU.title);
</script><script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script><script>/* shell sound button: OFF mutes the bid-game effects; 8-BIT/FORKASHI keep them (the shell plays the music) */
(function(){const SS=window.SnackSound;if(!SS||!SS.inShell)return;SS.onChange(m=>{const s=window.BidGame&&BidGame.sound;if(!s)return;if(m==='off')s.disable(false);else if(started)s.enable(false)});SS.onGesture(()=>{const s=window.BidGame&&BidGame.sound;try{if(s&&s.enabled&&s.ctx&&s.ctx.state==='suspended')s.ctx.resume()}catch(e){}})})();</script><script src="../../shared/hub/clicks.js" data-game="snackman"></script></body></html>
