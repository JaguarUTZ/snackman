<!doctype html><html lang="en"><head><script src="../../shared/hub/observe.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Snackman · Title</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fcfcfc;overflow:hidden;font-family:"Press Start 2P",monospace}
main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,20px);text-align:center;padding:12px;
 background:radial-gradient(ellipse at 50% 35%,#0a1f5c 0,#000 65%)}
.logo{font-size:clamp(26px,9vmin,64px);color:#FFD400;text-shadow:4px 4px 0 #b05000,8px 8px 0 #000;letter-spacing:2px}
img{width:min(60vw,38vh);image-rendering:pixelated}
.tag{font-size:clamp(8px,2.2vmin,13px);line-height:1.8;color:#58D854}
.go{font:inherit;font-size:clamp(11px,2.8vmin,16px);background:#FFD400;color:#000;border:0;padding:14px 18px;cursor:pointer;box-shadow:4px 4px 0 #8a6500;animation:bl 1s steps(2) infinite}
.go:focus{outline:3px solid #fff}@keyframes bl{50%{opacity:.35}}
.go2{font:inherit;font-size:clamp(9px,2.4vmin,12px);background:#0b0b0b;color:#ddd;border:2px solid #555;padding:10px 14px;cursor:pointer}.go2:focus,.go2:hover{border-color:#FFD400;color:#FFD400}.go2[hidden]{display:none}
.sel{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;font-size:8px;color:#888}
.sel a{color:#ddd;text-decoration:none;border:2px solid #333;padding:8px;background:#0b0b0b}
.sel a:hover,.sel a:focus{border-color:#FFD400;color:#FFD400}
.lk{opacity:.45;border-style:dashed!important}
.kit{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:0}
.gold img{filter:sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.08) drop-shadow(0 0 10px #ffd400)}
</style>
<script src="../../shared/emu/cart.js"></script><script src="../../shared/sound/cart-sound.js"></script>
<script src="https://jaguarutz-kit.vercel.app/kit.js" async></script><script src="snack-kit.js"></script>
</head><body><main>
<div class="logo">SNACKMAN</div>
<img src="a/snackman.gif" alt="Snackman: a yellow chomper with a green hard hat">
<p class="tag">SNACKMAN EATS PLASTIC.<br>POOPS BITCOIN.</p>
<button class="go" id="go" type="button" autofocus>▶ PRESS START</button><button class="go2" id="over" type="button" hidden>↺ START OVER</button>
<nav class="sel" aria-label="Stage select">STAGE SELECT<a href="prologue.html">PROLOGUE · PUT A BID ON PLASTIC</a><a href="levels.html?level=0">LV1 👩 SORT + WASH</a><a href="levels.html?level=1">LV2 🎺 WAH WAH</a><a href="levels.html?level=2">LV3 🏪 PARTNER CHAIN</a><a class="lk" href="#" onclick="return false" title="Beat levels 1-3 to unlock">🔒 MASTER LEVEL</a><a href="bonus3d.html">BONUS · SNACKMAN 3D</a></nav>
<div class="kit sk-row" id="kit" aria-label="Tip jar and golden skin"><span id="kittip"></span><span id="kitskin"></span></div>
<p class="tag" style="color:#666;font-size:7px">© HOWARD WOODS INTERACTIVE · ECOALQUIMIA</p>
</main>
<script src="../../shared/hub/save.js"></script><script>
let dest='prologue.html';const go=()=>location.href=dest;
try{localStorage.removeItem('snackman.away')}catch(e){} /* recap away stamp: stale on any page load */
HWSave.load('snackman').then(s=>{if(!s)return;const b=document.getElementById('go'),m=document.querySelector('.lk');
 /* saved run: CONTINUE is the default (button, Enter, START); START OVER clears the run (keeps high score + master unlock) */
 if(!s.done&&(s.level>0||s.score>0)){dest='levels.html?resume=1';b.textContent='▶ CONTINUE '+(s.level>=3?'MASTER LEVEL':'LV'+(s.level+1));
  const o=document.getElementById('over');o.hidden=false;o.onclick=()=>{HWSave.save('snackman',{best:s.best||0,master:!!s.master});location.href='prologue.html'}}
 if(s.master){m.classList.remove('lk');m.onclick=null;m.href='levels.html?level=3';m.textContent='★ MASTER LEVEL'}
 if(s.best)document.querySelector('.tag').insertAdjacentHTML('afterend','<p class="tag" style="color:#FFD400">HIGH SCORE '+(+s.best).toLocaleString()+' SATS</p>')});document.getElementById('go').onclick=go;
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('#kit,.jutz-ov'))return;const ae=document.activeElement;if((e.key==='Enter'||e.key===' ')&&ae.tagName!=='A'&&!(ae.tagName==='BUTTON'&&ae.id!=='go')){e.preventDefault();go()}});
window.EMU={title:'SNACKMAN',start:go};EMUCART.title('SNACKMAN');
/* kit hooks (guarded; game works the same without kit.js) */
try{if(window.SnackKit){SnackKit.tip('#kittip');SnackKit.skinButton('#kitskin');SnackKit.onChange(k=>document.body.classList.toggle('gold',!!k.gold))}}catch(e){}
</script><script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script><script src="../../shared/hub/clicks.js" data-game="snackman"></script></body></html>
